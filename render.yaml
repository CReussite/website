services:
  - type: web
    name: creussite-backend
    runtime: node
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        sync: false
      - key: CP_INVOICE_IBAN
        sync: false
      - key: CP_INVOICE_ACCOUNT_HOLDER
        sync: false
      - key: ADMIN_KEY
        sync: false
