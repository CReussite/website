<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Questionnaire bêta — C'Réussite</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--swan-wing); min-height: 100vh; }

    .beta-wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }

    /* ── Hero ── */
    .beta-hero { text-align: center; margin-bottom: 48px; }
    .beta-hero h1 { font-size: clamp(1.5rem, 3.5vw, 2rem); margin-bottom: 12px; }
    .beta-hero p  { font-size: 1rem; color: var(--text-mid); max-width: 500px; margin: 0 auto; }

    /* ── Choice cards ── */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .choice-card {
      background: #fff; border: 2px solid #e5e7eb; border-radius: 20px;
      padding: 40px 28px 32px; cursor: pointer; text-align: center; width: 100%;
      transition: border-color .2s, box-shadow .2s, transform .15s;
    }
    .choice-card:hover {
      border-color: var(--royal-blue); box-shadow: var(--shadow-md); transform: translateY(-3px);
    }
    .choice-icon  { font-size: 2.6rem; margin-bottom: 14px; }
    .choice-title { font-size: 1.1rem; font-weight: 700; color: var(--royal-blue); margin-bottom: 8px; }
    .choice-desc  { font-size: .88rem; color: var(--text-mid); line-height: 1.55; }
    .choice-badge {
      display: inline-block; background: var(--swan-wing); color: var(--royal-blue);
      font-size: .72rem; font-weight: 700; padding: 3px 12px; border-radius: 99px; margin-top: 16px;
    }

    /* ── Progress ── */
    .progress-wrap { margin-bottom: 32px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-bloc  { font-size: .8rem; font-weight: 700; color: var(--royal-blue); text-transform: uppercase; letter-spacing: .05em; }
    .progress-steps { font-size: .8rem; color: var(--text-mid); }
    .progress-track { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
    .progress-fill  { height: 100%; background: var(--royal-blue); border-radius: 99px; transition: width .35s ease; }

    /* ── Bloc header ── */
    .bloc-header { margin-bottom: 24px; }
    .bloc-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--royal-blue); color: #fff;
      font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
      padding: 4px 14px; border-radius: 99px; margin-bottom: 10px;
    }
    .optional-badge {
      background: rgba(255,255,255,.2); color: #fff;
      font-size: .68rem; font-weight: 600; padding: 1px 8px; border-radius: 99px;
    }
    .bloc-header h2 { font-size: 1.2rem; margin: 0 0 4px; }
    .bloc-header p  { font-size: .88rem; color: var(--text-mid); margin: 0; }

    /* ── Question cards ── */
    .question-card {
      background: #fff; border: 1.5px solid transparent; border-radius: 16px;
      padding: 22px 22px 18px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
    }
    .question-card.has-error { border-color: #fca5a5; }
    .q-label   { display: block; font-weight: 600; font-size: .93rem; color: var(--royal-blue); margin-bottom: 5px; }
    .q-required { color: #dc2626; margin-left: 2px; }
    .q-hint    { font-size: .8rem; color: var(--text-mid); font-style: italic; margin-bottom: 12px; }
    .q-error   { font-size: .78rem; color: #dc2626; margin-top: 7px; display: none; }
    .q-error.visible { display: block; }

    /* ── Inputs ── */
    .b-input, .b-textarea {
      width: 100%; padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-size: .9rem; font-family: var(--font-sans); color: var(--text-dark);
      background: #fff; transition: border-color .2s; margin-top: 10px;
    }
    .b-input:focus, .b-textarea:focus { outline: none; border-color: var(--royal-blue); }
    .b-textarea { min-height: 88px; resize: vertical; }

    /* ── Radio ── */
    .radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .radio-opt {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border: 1.5px solid #e5e7eb; border-radius: 10px; cursor: pointer;
      transition: border-color .15s, background .15s; user-select: none;
    }
    .radio-opt:hover { border-color: #b0bec5; background: #f8fafc; }
    .radio-dot {
      width: 18px; height: 18px; flex-shrink: 0; border: 2px solid #c0cce0; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .radio-opt.selected { border-color: var(--royal-blue); background: #f0f4ff; }
    .radio-opt.selected .radio-dot { border-color: var(--royal-blue); background: var(--royal-blue); }
    .radio-opt.selected .radio-dot::after {
      content: ''; display: block; width: 6px; height: 6px; border-radius: 50%; background: #fff;
    }
    .radio-lbl { font-size: .9rem; color: var(--text-dark); }
    .cond-field { margin-top: 12px; display: none; }
    .cond-field.visible { display: block; }
    .cond-label { display: block; font-size: .82rem; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }

    /* ── Checkboxes ── */
    .checkbox-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px; margin-top: 10px;
    }
    .checkbox-opt {
      display: flex; align-items: center; gap: 10px; padding: 9px 13px;
      border: 1.5px solid #e5e7eb; border-radius: 10px; cursor: pointer;
      user-select: none; transition: border-color .15s, background .15s;
    }
    .checkbox-opt:hover { border-color: #b0bec5; }
    .checkbox-box {
      width: 18px; height: 18px; flex-shrink: 0; border: 2px solid #c0cce0; border-radius: 4px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .checkbox-opt.selected { border-color: var(--royal-blue); background: #f0f4ff; }
    .checkbox-opt.selected .checkbox-box { background: var(--royal-blue); border-color: var(--royal-blue); }
    .checkbox-opt.selected .checkbox-box::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
    .checkbox-lbl { font-size: .86rem; color: var(--text-dark); }

    /* ── Stars ── */
    .star-row { display: flex; gap: 6px; margin-top: 10px; }
    .star-btn {
      font-size: 2rem; color: #d1d5db; background: none; border: none;
      padding: 0; cursor: pointer; transition: color .15s, transform .1s; line-height: 1;
    }
    .star-btn.lit  { color: #f59e0b; }
    .star-btn:hover { transform: scale(1.15); }

    /* ── Navigation ── */
    .form-nav {
      display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px;
    }
    .btn-prev {
      display: flex; align-items: center; gap: 6px; padding: 10px 20px;
      border: 1.5px solid #d1d5db; border-radius: 10px; background: #fff;
      color: var(--text-mid); font-size: .9rem; cursor: pointer; transition: border-color .15s, color .15s;
    }
    .btn-prev:hover { border-color: var(--royal-blue); color: var(--royal-blue); }
    .btn-prev.invisible { visibility: hidden; pointer-events: none; }
    .btn-next, .btn-submit {
      display: flex; align-items: center; gap: 6px; padding: 11px 26px;
      border: none; border-radius: 10px; font-size: .92rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s, transform .1s;
    }
    .btn-next   { background: var(--royal-blue); color: #fff; }
    .btn-submit { background: #16a34a; color: #fff; }
    .btn-next:hover, .btn-submit:hover { opacity: .88; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    /* ── Success ── */
    .success-wrap { display: flex; justify-content: center; padding-top: 20px; }
    .success-card {
      background: #fff; border-radius: 20px; padding: 56px 40px;
      text-align: center; box-shadow: var(--shadow-md); max-width: 460px; width: 100%;
    }
    .success-icon {
      width: 64px; height: 64px; background: #dcfce7; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin: 0 auto 20px;
    }
    .success-card h2 { margin-bottom: 10px; }
    .success-card p  { margin-bottom: 28px; }

    .fade-in { animation: bFadeIn .28s ease; }
    @keyframes bFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .choice-grid   { grid-template-columns: 1fr; }
      .checkbox-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <!-- Écran de choix -->
  <div id="choice-screen">
    <div class="beta-wrap">
      <div class="beta-hero">
        <h1>Questionnaire bêta-testeur</h1>
        <p>Merci pour ta participation ! Prends quelques minutes pour partager ton expérience — tes retours sont précieux.</p>
      </div>
      <div class="choice-grid">
        <button class="choice-card" onclick="startForm('pc')">
          <div class="choice-icon">⚗️</div>
          <div class="choice-title">Physique-Chimie</div>
          <div class="choice-desc">Tu as testé l'e-book Physique-Chimie uniquement</div>
          <div class="choice-badge">~10 min</div>
        </button>
        <button class="choice-card" onclick="startForm('bundle')">
          <div class="choice-icon">📐</div>
          <div class="choice-title">Maths + Physique-Chimie</div>
          <div class="choice-desc">Tu as testé les deux e-books (Pack)</div>
          <div class="choice-badge">~15 min</div>
        </button>
      </div>
    </div>
  </div>

  <!-- Formulaire -->
  <div id="form-screen" style="display:none;">
    <div class="beta-wrap">
      <div class="progress-wrap">
        <div class="progress-header">
          <span class="progress-bloc" id="prog-bloc"></span>
          <span class="progress-steps" id="prog-steps"></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="prog-fill" style="width:0%"></div>
        </div>
      </div>
      <div id="form-content"></div>
      <div class="form-nav">
        <button class="btn-prev invisible" id="btn-prev" onclick="prevBloc()">← Précédent</button>
        <button class="btn-next" id="btn-next" onclick="nextBloc()">Suivant →</button>
        <button class="btn-submit" id="btn-submit" onclick="submitForm()" style="display:none;">Envoyer mes retours</button>
      </div>
    </div>
  </div>

  <!-- Écran succès -->
  <div id="success-screen" style="display:none;">
    <div class="beta-wrap">
      <div class="success-wrap">
        <div class="success-card fade-in">
          <div class="success-icon">✓</div>
          <h2>Merci pour tes retours !</h2>
          <p>Ton questionnaire a bien été envoyé. Tes réponses vont nous aider à améliorer les fiches.</p>
          <a href="index.html" class="btn btn-primary">Retour au site</a>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="js/nav.js"></script>
  <script src="js/footer.js"></script>
  <script>
  (function () {
    var BACKEND = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://creussite-backend.onrender.com';

    var formType    = null;
    var currentBloc = 0;
    var formData    = {};

    /* ---- Listes d'options ---- */
    var OPT_RECOMMANDATION = [
      { v: 'oui_certain',      l: 'Oui, sans hésiter' },
      { v: 'oui_probablement', l: 'Probablement oui' },
      { v: 'je_sais_pas',      l: 'Je ne sais pas' },
      { v: 'probablement_pas', l: 'Probablement pas' },
      { v: 'non',              l: 'Non' }
    ];
    var OPT_PRIX_PARENTS = [
      { v: 'oui_certain',      l: 'Oui, sans hésiter' },
      { v: 'oui_probablement', l: 'Oui, probablement' },
      { v: 'je_sais_pas',      l: 'Je ne sais pas' },
      { v: 'probablement_pas', l: 'Probablement pas' },
      { v: 'non',              l: 'Non' }
    ];
    var OPT_UTILE_AVANT = [
      { v: 'oui',       l: 'Oui, vraiment' },
      { v: 'peut_etre', l: 'Peut-être' },
      { v: 'non',       l: 'Non, pas vraiment' }
    ];
    var OPT_MATIERES = [
      { v: 'hg',      l: 'Histoire-Géographie' },
      { v: 'ses',     l: 'SES' },
      { v: 'philo',   l: 'Philosophie' },
      { v: 'svt',     l: 'SVT' },
      { v: 'anglais', l: 'Anglais' },
      { v: 'autre',   l: 'Autre' },
      { v: 'non',     l: 'Pas intéressé(e)' }
    ];

    /* ---- Helpers champs ---- */
    function fText(id, lbl, placeholder, required) {
      return { type: 'text', id: id, label: lbl, placeholder: placeholder || '', required: !!required };
    }
    function fEmail(id, lbl) {
      return { type: 'email', id: id, label: lbl, required: true };
    }
    function fTextarea(id, lbl, hint) {
      return { type: 'textarea', id: id, label: lbl, hint: hint || null };
    }
    function fRadio(id, lbl, opts, required) {
      return { type: 'radio', id: id, label: lbl, opts: opts, required: !!required };
    }
    function fRadioDetail(id, lbl, opts, required, detailId, detailLbl, trigger) {
      return {
        type: 'radio-detail', id: id, label: lbl, opts: opts, required: !!required,
        detailId: detailId, detailLabel: detailLbl,
        trigger: trigger === undefined ? null : trigger
      };
    }
    function fStars(id, lbl) {
      return { type: 'stars', id: id, label: lbl, required: true };
    }
    function fCheckboxes(id, lbl, opts) {
      return { type: 'checkboxes', id: id, label: lbl, opts: opts };
    }

    /* ---- Blocs ---- */
    function blocIdent() {
      return {
        tag: 'Pour commencer', title: 'Identification', optional: false,
        subtitle: 'Ces infos nous permettent d\'identifier ton retour.',
        fields: [
          fText('prenom', 'Ton prénom', 'Marie', true),
          fEmail('email', 'Ton adresse email')
        ]
      };
    }

    function blocExp(subject, prefix, num) {
      var titles = {
        maths: 'Expérience — Mathématiques',
        pc:    'Expérience — Physique-Chimie'
      };
      return {
        tag: 'Bloc ' + num, title: titles[subject], optional: false,
        fields: [
          fTextarea(prefix + '_q1_fiche_utile',
            'Quelle fiche t\'a semblé la plus utile ou la mieux faite ?',
            'Si tu devais n\'en garder qu\'une, laquelle ce serait ?'),
          fRadioDetail(prefix + '_q2_erreurs',
            'Est-ce qu\'il y a des choses qui t\'ont semblé fausses ?',
            [{ v: 'non', l: 'Non, je n\'ai rien remarqué de faux' }, { v: 'oui', l: 'Oui' }],
            true, prefix + '_q2_erreurs_detail', 'Précise ce qui t\'a semblé faux :', 'oui'),
          fRadioDetail(prefix + '_q3_incompris',
            'Y a-t-il une notion que tu n\'as pas réussi à comprendre avec les fiches ?',
            [{ v: 'non', l: 'Non, tout était clair' }, { v: 'oui', l: 'Oui' }],
            true, prefix + '_q3_incompris_detail', 'Précise la notion et pourquoi selon toi :', 'oui'),
          fRadioDetail(prefix + '_q4_manquant',
            'Y a-t-il quelque chose d\'important qui manque dans les fiches ?',
            [{ v: 'non', l: 'Non, le programme me semble bien couvert' }, { v: 'oui', l: 'Oui' }],
            true, prefix + '_q4_manquant_detail', 'Quelle notion ou quel contenu manque ?', 'oui')
        ]
      };
    }

    function blocAvis(isPack, num) {
      var fields = [];
      if (isPack) {
        fields.push(fStars('note_maths', 'Combien d\'étoiles pour l\'e-book Maths ?'));
        fields.push(fStars('note_pc',    'Et pour l\'e-book Physique-Chimie ?'));
      } else {
        fields.push(fStars('note_pc', 'Combien d\'étoiles pour cet e-book ?'));
      }
      fields.push(
        fRadio('recommandation',
          'Est-ce que tu en parlerais à un(e) camarade qui prépare le bac ?',
          OPT_RECOMMANDATION, true),
        fTextarea('recommandation_pourquoi', 'Pourquoi ?', null),
        fTextarea('frein_achat',
          'Qu\'est-ce qui t\'aurait empêché d\'acheter ces fiches si tu avais dû les payer ?', null),
        fTextarea('avis_publiable',
          isPack
            ? 'En quelques phrases, écris un avis global (sur les deux e-books) qu\'on pourrait publier sur le site.'
            : 'En quelques phrases, écris un avis qu\'on pourrait publier sur le site.', null),
        fRadioDetail('accord_publication',
          'Es-tu d\'accord qu\'on publie ton avis sur le site ?',
          [{ v: 'oui', l: 'Oui' }, { v: 'non', l: 'Non' }],
          false, 'prenom_publication', 'Quel prénom veux-tu qu\'on utilise ?', 'oui')
      );
      return { tag: 'Bloc ' + num, title: 'Ton avis global', optional: false, fields: fields };
    }

    function blocParents(num, prixLbl) {
      return {
        tag: 'Bloc ' + num, title: 'L\'avis de tes parents', optional: true,
        subtitle: 'Montre-leur les fiches si tu peux et partage leur réaction.',
        fields: [
          fTextarea('parents_avis', 'Qu\'est-ce que tes parents pensent des fiches ?', null),
          fRadio('parents_prix',
            'Tes parents trouvent-ils le prix (' + prixLbl + ') raisonnable ?',
            OPT_PRIX_PARENTS, false),
          fText('parents_prix_propose',
            'Si le prix ne leur convient pas, à combien seraient-ils prêts à acheter ?'),
          fTextarea('parents_avis_publiable',
            'Si tes parents souhaitent laisser un avis à publier sur le site, qu\'écriraient-ils ?', null),
          fText('parents_prenom_publication', 'Prénom du parent (pour la publication)'),
          fRadio('parents_accord_publication',
            'Tes parents sont-ils d\'accord de publier leur avis ?',
            [{ v: 'oui', l: 'Oui' }, { v: 'non', l: 'Non' }], false)
        ]
      };
    }

    function blocSuite(num) {
      return {
        tag: 'Bloc ' + num, title: 'Pour la suite', optional: false,
        fields: [
          fCheckboxes('matieres_souhaitees',
            'Aimerais-tu des e-books similaires dans d\'autres matières de Terminale ?',
            OPT_MATIERES),
          fRadioDetail('utile_avant',
            'Ce type de fiches t\'aurait-il été utile les années précédentes (Première, Seconde…) ?',
            OPT_UTILE_AVANT, false,
            'utile_avant_detail', 'Dans quelles matières et à quel niveau ?', 'oui'),
          fTextarea('commentaires', 'Des commentaires généraux ou des suggestions ?', null)
        ]
      };
    }

    /* ---- Définition des formulaires ---- */
    var FORMS = {
      pc: [
        blocIdent(),
        blocExp('pc', 'pc', 1),
        blocAvis(false, 2),
        blocParents(3, '14,99 €'),
        blocSuite(4)
      ],
      bundle: [
        blocIdent(),
        blocExp('maths', 'maths', 1),
        blocExp('pc', 'pc', 2),
        blocAvis(true, 3),
        blocParents(4, '24,99 €'),
        blocSuite(5)
      ]
    };

    /* ---- Helpers d'échappement ---- */
    function eH(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function eA(s) {
      return String(s || '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    /* ---- Rendu d'un champ ---- */
    function renderField(f) {
      var val  = formData[f.id] !== undefined ? formData[f.id] : '';
      var inner = '';

      if (f.type === 'text') {
        inner = '<input type="text" class="b-input" oninput="window._sf(\'' + f.id + '\',this.value)"'
          + ' value="' + eA(val) + '" placeholder="' + eA(f.placeholder) + '">';

      } else if (f.type === 'email') {
        inner = '<input type="email" class="b-input" oninput="window._sf(\'' + f.id + '\',this.value)"'
          + ' value="' + eA(val) + '" placeholder="ex : marie@gmail.com">';

      } else if (f.type === 'textarea') {
        inner = '<textarea class="b-textarea" oninput="window._sf(\'' + f.id + '\',this.value)">'
          + eH(val) + '</textarea>';

      } else if (f.type === 'radio') {
        inner = '<div class="radio-group">'
          + f.opts.map(function(o) {
              var sel = val === o.v ? ' selected' : '';
              return '<div class="radio-opt' + sel + '" data-group="' + f.id + '" data-value="' + o.v + '"'
                + ' onclick="window._pr(this)">'
                + '<span class="radio-dot"></span>'
                + '<span class="radio-lbl">' + eH(o.l) + '</span></div>';
            }).join('') + '</div>';

      } else if (f.type === 'radio-detail') {
        var dVal     = formData[f.detailId] !== undefined ? formData[f.detailId] : '';
        var showCond = f.trigger === null ? val !== '' : val === f.trigger;
        inner = '<div class="radio-group">'
          + f.opts.map(function(o) {
              var sel = val === o.v ? ' selected' : '';
              return '<div class="radio-opt' + sel + '"'
                + ' data-group="' + f.id + '" data-value="' + o.v + '"'
                + ' data-detail-id="' + f.detailId + '"'
                + ' data-trigger="' + eA(f.trigger === null ? '' : f.trigger) + '"'
                + ' data-trigger-mode="' + (f.trigger === null ? 'always' : 'match') + '"'
                + ' onclick="window._prd(this)">'
                + '<span class="radio-dot"></span>'
                + '<span class="radio-lbl">' + eH(o.l) + '</span></div>';
            }).join('') + '</div>'
          + '<div class="cond-field' + (showCond ? ' visible' : '') + '" id="cond-' + f.detailId + '">'
          + '<span class="cond-label">' + eH(f.detailLabel) + '</span>'
          + '<textarea class="b-textarea" oninput="window._sf(\'' + f.detailId + '\',this.value)">'
          + eH(dVal) + '</textarea></div>';

      } else if (f.type === 'stars') {
        var sv = Number(val) || 0;
        inner = '<div class="star-row" data-field="' + f.id + '">'
          + [1,2,3,4,5].map(function(n) {
              return '<button type="button" class="star-btn' + (n <= sv ? ' lit' : '') + '"'
                + ' onmouseover="window._hs(\'' + f.id + '\',' + n + ')"'
                + ' onmouseout="window._hs(\'' + f.id + '\',0)"'
                + ' onclick="window._ps(\'' + f.id + '\',' + n + ')">★</button>';
            }).join('') + '</div>';

      } else if (f.type === 'checkboxes') {
        var cks = Array.isArray(val) ? val : [];
        inner = '<div class="checkbox-grid">'
          + f.opts.map(function(o) {
              var sel = cks.indexOf(o.v) !== -1 ? ' selected' : '';
              return '<div class="checkbox-opt' + sel + '" data-group="' + f.id + '" data-value="' + o.v + '"'
                + ' onclick="window._tc(this)">'
                + '<span class="checkbox-box"></span>'
                + '<span class="checkbox-lbl">' + eH(o.l) + '</span></div>';
            }).join('') + '</div>';
      }

      var req = f.required ? '<span class="q-required">*</span>' : '';
      return '<div class="question-card" id="qcard-' + f.id + '">'
        + '<span class="q-label">' + eH(f.label) + req + '</span>'
        + (f.hint ? '<div class="q-hint">' + eH(f.hint) + '</div>' : '')
        + inner
        + '<div class="q-error" id="qerr-' + f.id + '">Ce champ est requis.</div>'
        + '</div>';
    }

    function renderBloc(bloc) {
      var badge = bloc.optional ? '<span class="optional-badge">Optionnel</span>' : '';
      var sub   = bloc.subtitle ? '<p>' + eH(bloc.subtitle) + '</p>' : '';
      return '<div class="bloc-header">'
        + '<div class="bloc-tag">' + eH(bloc.tag) + badge + '</div>'
        + '<h2>' + eH(bloc.title) + '</h2>' + sub + '</div>'
        + bloc.fields.map(renderField).join('');
    }

    function updateProgress() {
      var blocs  = FORMS[formType];
      var total  = blocs.length;
      var step   = currentBloc + 1;
      var isLast = currentBloc === total - 1;
      document.getElementById('prog-bloc').textContent  = blocs[currentBloc].tag;
      document.getElementById('prog-steps').textContent = 'Étape ' + step + ' / ' + total;
      document.getElementById('prog-fill').style.width  = Math.round(step / total * 100) + '%';
      document.getElementById('btn-prev').classList.toggle('invisible', currentBloc === 0);
      document.getElementById('btn-next').style.display   = isLast ? 'none' : 'flex';
      document.getElementById('btn-submit').style.display = isLast ? 'flex' : 'none';
    }

    function showBloc(idx) {
      currentBloc = idx;
      var el = document.getElementById('form-content');
      el.innerHTML = renderBloc(FORMS[formType][idx]);
      el.classList.remove('fade-in');
      void el.offsetWidth;
      el.classList.add('fade-in');
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ---- Gestionnaires d'interaction ---- */
    window._sf = function(id, val) { formData[id] = val; };

    window._pr = function(el) {
      var g = el.dataset.group;
      formData[g] = el.dataset.value;
      document.querySelectorAll('[data-group="' + g + '"]').forEach(function(e) { e.classList.remove('selected'); });
      el.classList.add('selected');
    };

    window._prd = function(el) {
      var g   = el.dataset.group;
      var v   = el.dataset.value;
      var did = el.dataset.detailId;
      var tm  = el.dataset.triggerMode;
      var tr  = el.dataset.trigger;
      formData[g] = v;
      document.querySelectorAll('[data-group="' + g + '"]').forEach(function(e) { e.classList.remove('selected'); });
      el.classList.add('selected');
      if (did) {
        var cond = document.getElementById('cond-' + did);
        if (cond) {
          var show = tm === 'always' || v === tr;
          cond.classList.toggle('visible', show);
          if (!show) delete formData[did];
        }
      }
    };

    window._tc = function(el) {
      var g = el.dataset.group;
      var v = el.dataset.value;
      if (!Array.isArray(formData[g])) formData[g] = [];
      var idx = formData[g].indexOf(v);
      if (idx === -1) { formData[g].push(v); el.classList.add('selected'); }
      else            { formData[g].splice(idx, 1); el.classList.remove('selected'); }
    };

    window._ps = function(fid, n) {
      formData[fid] = n;
      document.querySelectorAll('[data-field="' + fid + '"] .star-btn').forEach(function(b, i) {
        b.classList.toggle('lit', i < n);
      });
    };

    window._hs = function(fid, n) {
      var cur = Number(formData[fid]) || 0;
      document.querySelectorAll('[data-field="' + fid + '"] .star-btn').forEach(function(b, i) {
        b.classList.toggle('lit', i < (n || cur));
      });
    };

    /* ---- Validation ---- */
    function validate(bloc) {
      var ok = true;
      bloc.fields.forEach(function(f) {
        if (!f.required) return;
        var val   = formData[f.id];
        var valid = false;
        if (f.type === 'email') {
          valid = !!(val && val.indexOf('@') !== -1 && val.indexOf('.') !== -1);
        } else if (f.type === 'text') {
          valid = !!(val && String(val).trim().length > 0);
        } else if (f.type === 'stars') {
          valid = Number(val) > 0;
        } else if (f.type === 'radio' || f.type === 'radio-detail') {
          valid = !!(val && val.length > 0);
        } else {
          valid = true;
        }
        var card = document.getElementById('qcard-' + f.id);
        var err  = document.getElementById('qerr-' + f.id);
        if (!valid) {
          if (card) card.classList.add('has-error');
          if (err)  err.classList.add('visible');
          ok = false;
        } else {
          if (card) card.classList.remove('has-error');
          if (err)  err.classList.remove('visible');
        }
      });
      return ok;
    }

    /* ---- Navigation ---- */
    window.startForm = function(type) {
      formType = type; formData = {}; currentBloc = 0;
      document.getElementById('choice-screen').style.display = 'none';
      document.getElementById('form-screen').style.display   = 'block';
      showBloc(0);
    };

    window.nextBloc = function() {
      if (!validate(FORMS[formType][currentBloc])) {
        var first = document.querySelector('.question-card.has-error');
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      showBloc(currentBloc + 1);
    };

    window.prevBloc = function() {
      if (currentBloc > 0) showBloc(currentBloc - 1);
    };

    /* ---- Envoi ---- */
    window.submitForm = async function() {
      if (!validate(FORMS[formType][currentBloc])) return;
      var btn = document.getElementById('btn-submit');
      btn.disabled    = true;
      btn.textContent = 'Envoi en cours…';
      try {
        var res = await fetch(BACKEND + '/api/beta-feedback', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(Object.assign({ type: formType }, formData))
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erreur serveur');
        document.getElementById('form-screen').style.display    = 'none';
        document.getElementById('success-screen').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        btn.disabled    = false;
        btn.textContent = 'Envoyer mes retours';
        alert('Erreur lors de l\'envoi : ' + err.message + '\nRéessaie dans quelques instants.');
      }
    };
  })();
  </script>
</body>
</html>
